<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portal OSIS</title>

  <style>
    .table-container {
      max-width: 100%;
      overflow-x: auto;
      border: 1px solid #ddd;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f5f9;
      color: #202938;
    }

    /* HEADER RINGKAS */
    header {
      background: #173b70;
      color: white;
      padding: 8px 12px;
    }

    .header-inner {
      max-width: 1200px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    header h1 {
      margin: 0;
      font-size: 16px;
    }

    header p {
      display: none;
    }

    button, select, input {
      font: inherit;
    }

    button {
      border: 0;
      border-radius: 6px;
      padding: 6px 10px;
      cursor: pointer;
      font-weight: bold;
      font-size: 12px;
    }

    button:disabled {
      opacity: .50;
      cursor: not-allowed;
    }

    #saveButton {
      background: #16a36a;
      color: white;
      display: none;
    }

    #reloadButton {
      background: white;
      color: #173b70;
    }

    .hidden-element {
      display: none !important;
    }

    main {
      max-width: 1200px;
      margin: 16px auto;
      padding: 0 12px;
    }

    .panel {
      background: white;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 2px 10px rgba(0,0,0,.05);
      margin-bottom: 16px;
    }

    #status {
      padding: 10px 12px;
      border-radius: 8px;
      background: #edf2f8;
      color: #43516a;
      font-size: 13px;
      margin-bottom: 12px;
      white-space: pre-wrap;
    }

    #status.error {
      background: #fff0f0;
      color: #a32626;
    }

    #status.success {
      background: #eaf8f0;
      color: #176b42;
    }

    /* TABEL DATA */
    .table-wrap {
      width: 100%;
      overflow: auto;
      border: 1px solid #dce1e9;
      border-radius: 9px;
      max-height: 75vh;
    }

    table {
      border-collapse: collapse;
      table-layout: fixed;
      width: max-content;
      background: white;
      font-size: 13px;
    }

    th, td {
      border: 1px solid #dce1e9;
      padding: 6px 4px;
      min-width: 20px;
      max-width: 350px;
      text-align: center;
      vertical-align: middle;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    td:nth-child(2) {
      text-align: left;
    }

    /* HEADER STICKY ATAS */
    thead tr:nth-child(1) th {
      position: sticky;
      top: 0;
      z-index: 10;
      background: #eaf0f8;
      color: #173b70;
      line-height: 1.2;
    }

    thead tr:nth-child(2) th {
      position: sticky;
      top: 28px;
      z-index: 9;
      background: #eaf0f8;
      color: #173b70;
      line-height: 1.2;
    }

    /* FREEZE KOLOM PERTAMA (KIRI) */
    .freeze-col {
      position: sticky !important;
      left: 0 !important;
      z-index: 11 !important;
      background-color: #ffffff !important;
    }

    thead th.freeze-col {
      z-index: 12 !important;
      background-color: #d8e4f4 !important;
    }

    tbody tr:nth-child(even) td.freeze-col {
      background-color: #f8f9fa !important;
    }

    td.editable {
      background: #fffdf2;
      cursor: text;
    }

    td.editable:focus {
      outline: 2px solid #3478d4;
      outline-offset: -2px;
      background: #fff;
    }

    td.formula {
      background: #f0f1f3;
      color: #727b89;
      cursor: not-allowed;
    }

    td.changed {
      background: #fff0c9;
    }

    .empty {
      padding: 25px;
      text-align: center;
      color: #6d7788;
    }

    .footer-note {
      color: #697589;
      font-size: 12px;
      margin-top: 12px;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 15px;
      }

      th, td {
        min-width: 20px;
        padding: 8px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">
    <div>
      <h1>Portal OSIS</h1>
      <p>Sistem Informasi Organisasi Siswa Intra Sekolah</p>
    </div>

    <div>
      <button id="saveButton" onclick="saveChanges()">
        Simpan Perubahan
      </button>

      <button id="addRowButton" onclick="tambahBaris()" style="background: #28a745; color: white; display: none;">
        + Tambah Baris
      </button>

      <button id="reloadButton" onclick="loadSheet()">
        Muat Ulang
      </button>
    </div>
  </div>
</header>

<main>

  <div class="hidden-element">
    <select id="sheetSelect" onchange="changeSheet()">
      <option value="DASHBOARD">DASHBOARD</option>
      <option value="ACARA">ACARA</option>
      <option value="ABSEN">ABSEN</option>
      <option value="Dashboard">Dashboard</option>
      <option value="Kalender">Kalender</option>
      <option value="REKAP">REKAP</option>
      <option value="PENGELUARAN">PENGELUARAN</option>
    </select>
    <h2 id="sheetTitle"></h2>
    <div id="sheetInfo"></div>
  </div>

  <div id="status">Menghubungkan ke server...</div>

  <section class="panel">
    <div class="table-wrap">
      <table id="dataTable">
        <tbody>
          <tr>
            <td class="empty">Data sedang dimuat...</td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="footer-note">
      Sel berwarna kuning muda dapat diedit jika akun memiliki izin.
      Sel berwarna abu-abu berisi formula atau tidak dapat diedit.
    </div>
  </section>

</main>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbzLOGNYrQFMm_DWfumPS-12gbLhwS5RWOAeDFqi5uEGpJf59_Gfmd1mNsENNoBtqfzw/exec";

  const SHEET_NAMES = [
    "DASHBOARD",
    "ACARA",
    "ABSEN",
    "Dashboard",
    "Kalender",
    "REKAP",
    "PENGELUARAN"
  ];

  const SHEET_COLUMN_WIDTHS = {
    "REKAP": {
      "NO": "40px",
      "NAMA": "160px",
      "TOTAL": "80px",
      "(TANPA JUDUL)": "80px"
    },
    "ACARA": {
      0: "60px",
      1: "80px",
      2: "200px",
      3: "60px",
      4: "60px",
      5: "60px",
      6: "100px"
    },
    "ABSEN": {
      0: "40px",
      1: "170px",
      2: "20px",
      "NO": "40px",
      "NAMA": "170px",
      "TOTAL": "80"
    },
    "KALENDER": {
      1: "50px",
      "HARI": "50px"
    }
  };

  const params = new URLSearchParams(location.search);
  let currentSheet = params.get("sheet") || "DASHBOARD";

  if (!SHEET_NAMES.map(s => s.toUpperCase()).includes(currentSheet.toUpperCase())) {
    currentSheet = "DASHBOARD";
  }

  const hashParams = new URLSearchParams(location.hash.replace(/^#/, ""));
  const TOKEN = hashParams.get("token") || "";

  let currentData = null;
  let pendingChanges = new Map();
  let isLoading = false;
  let isSaving = false;

  const sheetSelect = document.getElementById("sheetSelect");
  const sheetTitle = document.getElementById("sheetTitle");
  const sheetInfo = document.getElementById("sheetInfo");
  const statusBox = document.getElementById("status");
  const dataTable = document.getElementById("dataTable");
  const saveButton = document.getElementById("saveButton");

  function showStatus(message, type = "") {
    statusBox.textContent = message;
    statusBox.className = type;
  }

  async function apiRequest(payload) {
    const response = await fetch(API_URL, {
      method: "POST",
      redirect: "follow",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      body: JSON.stringify(payload)
    });

    if (!response.ok) {
      throw new Error("Server memberikan status HTTP " + response.status);
    }

    const result = await response.json();
    if (!result.success) {
      throw new Error(result.message || "Permintaan API gagal.");
    }

    return result.data;
  }

  function changeSheet() {
    const nextSheet = sheetSelect.value;

    if (
      pendingChanges.size > 0 &&
      !confirm("Ada perubahan yang belum disimpan. Pindah sheet dan membuang perubahan tersebut?")
    ) {
      sheetSelect.value = currentSheet;
      return;
    }

    currentSheet = nextSheet;
    pendingChanges.clear();

    const newUrl = new URL(location.href);
    newUrl.searchParams.set("sheet", currentSheet);
    history.replaceState(null, "", newUrl);

    loadSheet();
  }

  async function loadSheet() {
    if (isLoading) return;

    if (pendingChanges.size > 0) {
      if (!confirm("Perubahan belum disimpan. Muat ulang dan buang perubahan tersebut?")) {
        return;
      }
    }

    isLoading = true;
    pendingChanges.clear();
    updateSaveButton();

    sheetSelect.value = currentSheet;
    showStatus("Sedang mengambil data " + currentSheet + "...");

    dataTable.innerHTML = '<tbody><tr><td class="empty">Memuat data...</td></tr></tbody>';

    try {
      const data = await apiRequest({
        action: "getSheetData",
        sheet: currentSheet,
        token: TOKEN
      });

      currentData = data;
      renderTable(data);

      sheetTitle.textContent = data.name;
      sheetInfo.textContent =
        "Baris header: " + data.headerRow +
        " | Total baris data: " + data.rows.length +
        (data.editable ? " | Mode edit aktif" : " | Mode baca");

      showStatus(
        data.editable
          ? "Data berhasil dimuat. Anda memiliki izin edit pada sheet ini."
          : "Data berhasil dimuat dalam mode baca.",
        "success"
      );

      updateSaveButton();

    } catch (err) {
      currentData = null;
      showStatus("Gagal mengambil data: " + err.message, "error");
      dataTable.innerHTML = '<tbody><tr><td class="empty">Data tidak dapat dimuat.</td></tr></tbody>';
      sheetTitle.textContent = currentSheet;
      sheetInfo.textContent = "Gagal memuat data.";
    } finally {
      isLoading = false;
    }
  }

  function renderTable(data) {
    dataTable.innerHTML = "";

    const sheetKey = String(currentSheet || "").toUpperCase();
    const widthConfigs = SHEET_COLUMN_WIDTHS[sheetKey] || {};

    let validColIndexes = data.headers.map((_, i) => i);
    let rowsToRender = data.rows;

    if (sheetKey === "REKAP") {
      const hiddenHeaderNames = ["ID_INTERNAL", "CATATAN_RAHASIA"];
      const hiddenColIndexes = [];

      validColIndexes = data.headers
        .map((header, index) => {
          const hName = String(header || "").trim().toUpperCase();
          if (hiddenHeaderNames.includes(hName) || hiddenColIndexes.includes(index)) {
            return -1;
          }
          return index;
        })
        .filter(index => index !== -1);

      const hiddenRowNumbers = [3];

      rowsToRender = data.rows.filter(rowData => {
        const rowNum = Number(rowData.rowNumber);
        return !hiddenRowNumbers.includes(rowNum);
      });
    }

    /* 1. KONTROL UKURAN KOLOM DENGAN COLGROUP */
    const colgroup = document.createElement("colgroup");
    validColIndexes.forEach((colIndex, visualIndex) => {
      const col = document.createElement("col");
      const headerName = String(data.headers[colIndex] || "").trim().toUpperCase();
      
      let colWidth = widthConfigs[headerName] || widthConfigs[colIndex];
      
      if (!colWidth) {
        if (headerName.includes("TOTAL")) {
          colWidth = "80px";
        } else if (visualIndex === 0) {
          colWidth = "40px";
        } else if (visualIndex === 1) {
          colWidth = "160px";
        } else {
          colWidth = "35px";
        }
      }

      col.style.width = colWidth;
      colgroup.appendChild(col);
    });
    dataTable.appendChild(colgroup);

    /* 2. RENDER THEAD (HEADER TABEL) */
    const thead = document.createElement("thead");

    if (data.headerRows && data.headerRows.length >= 2) {
      const row1 = data.headerRows[0];
      const row2 = data.headerRows[1];

      const tr1 = document.createElement("tr");
      const tr2 = document.createElement("tr");

      let i = 0;
      while (i < validColIndexes.length) {
        const colIdx = validColIndexes[i];
        const h1 = String(row1[colIdx] || "").trim();
        const h2 = String(row2[colIdx] || "").trim();

        let span = 1;
        while (
          i + span < validColIndexes.length &&
          String(row1[validColIndexes[i + span]] || "").trim() === h1 &&
          h1 !== ""
        ) {
          span++;
        }

        if (span > 1) {
          const th1 = document.createElement("th");
          th1.textContent = h1;
          th1.colSpan = span;
          if (i === 0) th1.classList.add("freeze-col");
          tr1.appendChild(th1);

          for (let s = 0; s < span; s++) {
            const subIdx = validColIndexes[i + s];
            const subH2 = String(row2[subIdx] || "").trim();
            const th2 = document.createElement("th");
            th2.textContent = subH2 || "(Tanpa judul)";
            if (i + s === 0) th2.classList.add("freeze-col");
            tr2.appendChild(th2);
          }
          i += span;
        } else {
          if (h2 === "" || h1 === h2) {
            const th = document.createElement("th");
            const label = h1 || h2 || "(Tanpa judul)";
            th.textContent = label;
            th.rowSpan = 2;
            if (i === 0) th.classList.add("freeze-col");
            tr1.appendChild(th);
          } else {
            const th1 = document.createElement("th");
            th1.textContent = h1;
            if (i === 0) th1.classList.add("freeze-col");
            tr1.appendChild(th1);

            const th2 = document.createElement("th");
            th2.textContent = h2;
            if (i === 0) th2.classList.add("freeze-col");
            tr2.appendChild(th2);
          }
          i++;
        }
      }

      thead.appendChild(tr1);
      if (tr2.children.length > 0) {
        thead.appendChild(tr2);
      }

    } else {
      const headerRow = document.createElement("tr");
      validColIndexes.forEach((colIndex, visualIndex) => {
        const th = document.createElement("th");
        const headerName = String(data.headers[colIndex] || "").trim();
        th.textContent = headerName || "(Tanpa judul)";
        if (visualIndex === 0) th.classList.add("freeze-col");
        headerRow.appendChild(th);
      });
      thead.appendChild(headerRow);
    }

    dataTable.appendChild(thead);

    /* 3. RENDER TBODY (ISI DATA) */
    const tbody = document.createElement("tbody");

    if (!rowsToRender.length) {
      const tr = document.createElement("tr");
      const td = document.createElement("td");
      td.colSpan = validColIndexes.length;
      td.className = "empty";
      td.textContent = "Belum ada data.";
      tr.appendChild(td);
      tbody.appendChild(tr);
      dataTable.appendChild(tbody);
      return;
    }

    rowsToRender.forEach(rowData => {
      const tr = document.createElement("tr");

      validColIndexes.forEach((colIndex, visualIndex) => {
        const td = document.createElement("td");
        const value = rowData.values[colIndex] == null ? "" : rowData.values[colIndex];

        td.textContent = value;

        // Mengikuti warna latar belakang dari Google Sheets
        const cellBackground = rowData.backgrounds
  ? rowData.backgrounds[colIndex]
  : null;

        if (cellBackground) {
  td.style.backgroundColor = cellBackground;
}
        if (visualIndex === 0) {
          td.classList.add("freeze-col");
        }

        const isFormula = rowData.formulaCols.includes(colIndex + 1);
        if (isFormula) {
          td.classList.add("formula");
        } else if (data.editable) {
          td.classList.add("editable");
          td.contentEditable = "true";
          td.dataset.row = rowData.rowNumber;
          td.dataset.col = colIndex + 1;
          td.dataset.original = value;
          td.addEventListener("input", handleCellEdit);
        }

        tr.appendChild(td);
      });

      tbody.appendChild(tr);
    });

    dataTable.appendChild(tbody);
  }

  function handleCellEdit(event) {
    const cell = event.currentTarget;
    const row = Number(cell.dataset.row);
    const col = Number(cell.dataset.col);
    const original = cell.dataset.original;
    const value = cell.textContent;

    const key = row + ":" + col;

    if (value === original) {
      pendingChanges.delete(key);
      cell.classList.remove("changed");
    } else {
      pendingChanges.set(key, { row: row, col: col, value: value });
      cell.classList.add("changed");
    }

    updateSaveButton();
    showStatus(pendingChanges.size + " sel berubah dan belum disimpan.");
  }

  function updateSaveButton() {
    const canEdit = Boolean(currentData) && currentData.editable === true;
    const addRowBtn = document.getElementById("addRowButton");

    if (addRowBtn) {
      addRowBtn.style.display = canEdit ? "inline-block" : "none";
    }

    const canSave =
      canEdit &&
      Boolean(TOKEN) &&
      pendingChanges.size > 0 &&
      !isSaving;

    saveButton.style.display = canEdit ? "inline-block" : "none";
    saveButton.disabled = !canSave;
    saveButton.textContent = isSaving ? "Menyimpan..." : "Simpan Perubahan (" + pendingChanges.size + ")";
  }

  async function saveChanges() {
    if (isSaving || pendingChanges.size === 0) return;

    if (!TOKEN) {
      showStatus("Token pengurus tidak ditemukan. Silakan login melalui aplikasi OSIS.", "error");
      return;
    }

    if (!confirm("Simpan " + pendingChanges.size + " perubahan pada sheet " + currentSheet + "?")) {
      return;
    }

    isSaving = true;
    updateSaveButton();

    const changes = Array.from(pendingChanges.values());
    showStatus("Sedang menyimpan perubahan...");

    try {
      const result = await apiRequest({
        action: "saveSheetChanges",
        token: TOKEN,
        sheet: currentSheet,
        changes: changes
      });

      pendingChanges.clear();
      showStatus(result.message || "Perubahan berhasil disimpan.", "success");
      await loadSheet();

    } catch (err) {
      showStatus("Gagal menyimpan: " + err.message, "error");
    } finally {
      isSaving = false;
      updateSaveButton();
    }
  }

  function tambahBaris() {
    if (!currentData || !currentData.editable) {
      showStatus("Anda tidak memiliki izin untuk menambah data pada sheet ini.", "error");
      return;
    }

    const tbody = dataTable.querySelector("tbody");
    if (!tbody) return;

    const lastPhysicalRow = currentData.rows.length > 0
      ? currentData.rows[currentData.rows.length - 1].rowNumber
      : (currentData.headerRow || 1);

    const extraRows = tbody.querySelectorAll("tr.new-row").length;
    const nextRowNumber = lastPhysicalRow + extraRows + 1;

    const tr = document.createElement("tr");
    tr.classList.add("new-row");

    currentData.headers.forEach((_, colIndex) => {
      const td = document.createElement("td");
      td.className = "editable";
      td.contentEditable = "true";
      td.spellcheck = false;

      td.dataset.row = nextRowNumber;
      td.dataset.col = colIndex + 1;
      td.dataset.original = "";

      td.addEventListener("input", handleCellEdit);
      tr.appendChild(td);
    });

    tbody.appendChild(tr);

    const firstCell = tr.querySelector("td");
    if (firstCell) firstCell.focus();
  }

  sheetSelect.value = currentSheet;

  if (!TOKEN) {
    showStatus("Mode pengunjung: Anda dapat membaca data publik. Login melalui aplikasi OSIS untuk memperoleh hak edit.");
  }

  loadSheet();
</script>

</body>
</html>
