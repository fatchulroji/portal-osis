
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal OSIS</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f3f5f9;
  color: #202938;
}

header {
  position: sticky;
  top: 0;
  z-index: 10;
  background: #173b70;
  color: white;
  padding: 13px;
  box-shadow: 0 2px 7px #0002;
}

.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}

h2 {
  font-size: 17px;
  margin: 0;
}

button {
  border: 0;
  border-radius: 7px;
  padding: 10px 14px;
  font-weight: bold;
  cursor: pointer;
}

#saveBtn {
  background: #16a36a;
  color: white;
  display: none;
}

#saveBtn:disabled {
  opacity: .5;
}

#refreshBtn {
  background: white;
  color: #173b70;
}

.info {
  font-size: 12px;
  margin-top: 9px;
  color: #dce8f8;
}

main {
  padding: 12px;
}

.status {
  padding: 10px;
  margin-bottom: 10px;
  border-radius: 7px;
  background: white;
  font-size: 13px;
}

.table-wrap {
  width: 100%;
  overflow: auto;
  background: white;
  border-radius: 8px;
  box-shadow: 0 1px 5px #0001;
  max-height: calc(100vh - 135px);
}

table {
  width: max-content;
  min-width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}

th, td {
  border: 1px solid #cbd3df;
  padding: 7px;
  min-width: 90px;
  max-width: 220px;
  overflow-wrap: anywhere;
  vertical-align: middle;
}

th {
  background: #e7edf7;
  color: #173b70;
  position: sticky;
  top: 0;
  z-index: 2;
  white-space: normal;
}

td:first-child {
  background: #f7f8fb;
}

td input {
  width: 100%;
  min-width: 65px;
  border: 1px solid transparent;
  border-radius: 4px;
  padding: 5px;
  font-size: 12px;
  background: transparent;
  color: inherit;
}

td input:focus {
  outline: 1px solid #2563eb;
  background: #eff6ff;
}

td.changed {
  background: #fff4cf;
}

td.formula {
  background: #edf0f4;
  color: #697586;
}

.empty {
  padding: 25px;
  text-align: center;
  color: #777;
}

@media(max-width:600px) {
  main { padding: 7px; }
  header { padding: 10px; }
  th, td {
    padding: 6px;
    min-width: 76px;
    font-size: 11px;
  }
  h2 { font-size: 15px; }
  button { padding: 9px 10px; font-size: 12px; }
}
</style>
</head>

<body>

<header>
  <div class="top">
    <h2 id="title">PORTAL OSIS</h2>

    <div style="display:flex;gap:6px">
      <button id="refreshBtn" onclick="loadData()">
        MUAT ULANG
      </button>

      <button id="saveBtn" onclick="saveChanges()">
        SIMPAN
      </button>
    </div>
  </div>

  <div class="info" id="info">
    Menghubungkan ke server...
  </div>
</header>

<main>
  <div class="status" id="status">
    Memuat data...
  </div>

  <div class="table-wrap">
    <table id="dataTable"></table>
  </div>
</main>

<script>
"use strict";

// ===================================
// KONFIGURASI
// ===================================

const API_URL = "https://script.google.com/macros/s/AKfycbzLOGNYrQFMm_DWfumPS-12gbLhwS5RWOAeDFqi5uEGpJf59_Gfmd1mNsENNoBtqfzw/exec";

const params = new URLSearchParams(location.search);
const logicalName = params.get("sheet") || "DASHBOARD";

// Token memakai URL fragment (#), bukan query string.
// Fragment tidak dikirim ke server GitHub Pages.
const hashParams = new URLSearchParams(
  location.hash.replace(/^#/, "")
);

const TOKEN = hashParams.get("token") || "";

let sheetData = null;
let pendingChanges = new Map();
let loading = false;

const $ = id => document.getElementById(id);

const titles = {
  DASHBOARD: "DASHBOARD KEHADIRAN",
  ACARA: "DATA ACARA",
  ABSEN: "DATA ABSENSI",
  Dashboard: "DASHBOARD ANGGOTA",
  Kalender: "KALENDER KEGIATAN",
  REKAP: "REKAP KAS",
  PENGELUARAN: "PENGELUARAN KAS"
};

$("title").textContent =
  titles[logicalName] || "PORTAL OSIS";

// ===================================
// KOMUNIKASI API
// ===================================

async function apiRequest(action, payload) {
  const response = await fetch(API_URL, {
    method: "POST",
    headers: {
      "Content-Type": "text/plain;charset=utf-8"
    },
    body: JSON.stringify({
      action: action,
      ...payload
    })
  });

  if (!response.ok) {
    throw new Error("HTTP error " + response.status);
  }

  const result = await response.json();

  if (result.success === false || result.ok === false) {
    throw new Error(result.message || "Permintaan gagal.");
  }

  return result.data || result.result || result;
}

// ===================================
// MEMUAT DATA
// ===================================

async function loadData() {
  if (loading) return;

  loading = true;
  $("status").textContent = "Mengambil data...";
  $("refreshBtn").disabled = true;

  try {
    const result = await apiRequest("getSheetData", {
      token: TOKEN,
      logicalName: logicalName
    });

    sheetData = result;
    pendingChanges.clear();

    renderTable();

    $("status").textContent =
      "Data berhasil dimuat. " +
      result.rows.length + " baris data.";

    $("info").textContent =
      result.editable
        ? "Mode pengurus: dapat mengedit data."
        : "Mode anggota: hanya dapat melihat data.";

    $("saveBtn").style.display =
      result.editable ? "inline-block" : "none";

    updateSaveButton();

  } catch (error) {
    $("status").textContent =
      "Gagal memuat data: " + error.message;

    $("info").textContent = "Koneksi API bermasalah.";
    $("dataTable").innerHTML = "";
    $("saveBtn").style.display = "none";

  } finally {
    loading = false;
    $("refreshBtn").disabled = false;
  }
}

// ===================================
// MENAMPILKAN TABEL
// ===================================

function renderTable() {
  const table = $("dataTable");

  table.innerHTML = "";

  if (!sheetData || !sheetData.headers.length) {
    table.innerHTML =
      '<tr><td class="empty">Tidak ada data.</td></tr>';
    return;
  }

  const thead = document.createElement("thead");
  const headRow = document.createElement("tr");

  sheetData.headers.forEach(header => {
    const th = document.createElement("th");
    th.textContent = header || "-";
    headRow.appendChild(th);
  });

  thead.appendChild(headRow);
  table.appendChild(thead);

  const tbody = document.createElement("tbody");

  sheetData.rows.forEach(row => {
    const tr = document.createElement("tr");

    row.values.forEach((value, index) => {
      const td = document.createElement("td");

      const colNumber = index + 1;
      const isFormula =
        row.formulaCols.includes(colNumber);

      const canEdit =
        sheetData.editable &&
        !isFormula;

      if (canEdit) {
        const input = document.createElement("input");

        input.type = "text";
        input.value = value == null ? "" : value;

        input.addEventListener("input", function() {
          const original =
            String(row.values[index] ?? "");

          const current = input.value;

          const key =
            row.rowNumber + ":" + colNumber;

          if (current === original) {
            pendingChanges.delete(key);
            td.classList.remove("changed");
          } else {
            pendingChanges.set(key, {
              rowNumber: row.rowNumber,
              colNumber: colNumber,
              value: current
            });

            td.classList.add("changed");
          }

          updateSaveButton();
        });

        td.appendChild(input);

      } else {
        td.textContent = value == null ? "" : value;

        if (isFormula) {
          td.classList.add("formula");
        }
      }

      tr.appendChild(td);
    });

    tbody.appendChild(tr);
  });

  table.appendChild(tbody);
}

// ===================================
// TOMBOL SIMPAN TUNGGAL
// ===================================

function updateSaveButton() {
  const count = pendingChanges.size;

  $("saveBtn").disabled = count === 0;

  $("saveBtn").textContent =
    count > 0
      ? "SIMPAN (" + count + ")"
      : "SIMPAN";
}

async function saveChanges() {
  if (!sheetData || !sheetData.editable) {
    alert("Anda tidak memiliki izin edit.");
    return;
  }

  if (!TOKEN) {
    alert("Token pengurus tidak ditemukan.");
    return;
  }

  const changes = Array.from(
    pendingChanges.values()
  );

  if (!changes.length) {
    alert("Tidak ada perubahan.");
    return;
  }

  const confirmation = confirm(
    "Simpan " + changes.length +
    " perubahan pada sheet " + logicalName + "?"
  );

  if (!confirmation) return;

  $("saveBtn").disabled = true;
  $("saveBtn").textContent = "MENYIMPAN...";

  try {
    const result = await apiRequest(
      "saveSheetChanges",
      {
        token: TOKEN,
        logicalName: logicalName,
        changes: changes
      }
    );

    alert(
      result.message ||
      "Data berhasil disimpan."
    );

    await loadData();

  } catch (error) {
    alert(
      "Gagal menyimpan: " + error.message
    );

    updateSaveButton();
  }
}

// ===================================
// AWAL APLIKASI
// ===================================

if (!titles[logicalName]) {
  $("status").textContent = "Nama sheet tidak dikenal.";
} else if (!API_URL.startsWith("https://")) {
  $("status").textContent = "URL API belum dikonfigurasi.";
} else {
  loadData();
}

</script>
</body>
</html>
