<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portal OSIS</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f5f9;
      color: #202938;
    }

    header {
      background: #173b70;
      color: white;
      padding: 8px 12px;
    }

    .header-inner {
      max-width: 1200px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    header h1 {
      margin: 0;
      font-size: 16px;
    }

    header p {
      display: none;
    }

    button, select, input {
      font: inherit;
    }

    button {
      border: 0;
      border-radius: 6px;
      padding: 6px 10px;
      cursor: pointer;
      font-weight: bold;
      font-size: 12px;
    }

    button:disabled {
      opacity: .50;
      cursor: not-allowed;
    }

    #saveButton {
      background: #16a36a;
      color: white;
      display: none;
    }

    #reloadButton {
      background: white;
      color: #173b70;
    }

    .hidden-element {
      display: none !important;
    }

    main {
      max-width: 1200px;
      margin: 22px auto;
      padding: 0 14px;
    }

    .toolbar, .panel {
      background: white;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 2px 10px rgba(0,0,0,.05);
      margin-bottom: 16px;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    label {
      font-size: 14px;
      font-weight: bold;
    }

    select {
      min-width: 190px;
      padding: 10px;
      border: 1px solid #ccd3df;
      border-radius: 8px;
      background: white;
    }

    #sheetTitle {
      margin: 0 0 6px;
      font-size: 19px;
    }

    #sheetInfo {
      color: #657184;
      font-size: 13px;
    }

    #status {
      padding: 12px;
      border-radius: 8px;
      background: #edf2f8;
      color: #43516a;
      font-size: 14px;
      margin-bottom: 14px;
      white-space: pre-wrap;
    }

    #status.error {
      background: #fff0f0;
      color: #a32626;
    }

    #status.success {
      background: #eaf8f0;
      color: #176b42;
    }

    .table-wrap {
      width: 100%;
      overflow: auto;
      border: 1px solid #dce1e9;
      border-radius: 9px;
      max-height: 70vh;
    }

    table {
      border-collapse: collapse;
      width: max-content;
      min-width: 100%;
      background: white;
      font-size: 13px;
    }

    th, td {
      border: 1px solid #dce1e9;
      padding: 9px 10px;
      min-width: 110px;
      max-width: 320px;
      text-align: left;
      vertical-align: top;
      overflow-wrap: anywhere;
    }

    th {
      background: #eaf0f8;
      color: #173b70;
      position: sticky;
      top: 0;
      z-index: 2;
      white-space: nowrap;
    }

    td.row-number {
      min-width: 55px;
      width: 55px;
      background: #f5f7fa;
      color: #657184;
      text-align: center;
      font-weight: bold;
    }

    td.editable {
      background: #fffdf2;
      cursor: text;
    }

    td.editable:focus {
      outline: 2px solid #3478d4;
      outline-offset: -2px;
      background: #fff;
    }

    td.formula {
      background: #f0f1f3;
      color: #727b89;
      cursor: not-allowed;
    }

    td.changed {
      background: #fff0c9;
    }

    .empty {
      padding: 25px;
      text-align: center;
      color: #6d7788;
    }

    .footer-note {
      color: #697589;
      font-size: 12px;
      margin-top: 12px;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 18px;
      }

      .toolbar {
        align-items: stretch;
      }

      .toolbar select,
      .toolbar button {
        width: 100%;
      }

      th, td {
        min-width: 95px;
        padding: 8px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">
    <div>
      <h1>Portal OSIS</h1>
      <p>Sistem Informasi Organisasi Siswa Intra Sekolah</p>
    </div>

    <div>
      <button id="saveButton" onclick="saveChanges()">
        Simpan Perubahan
      </button>
      <button id="reloadButton" onclick="loadSheet()">
        Muat Ulang
      </button>
    </div>
  </div>
</header>

<main>

  <!-- Wadah elemen yang disembunyikan (ID tetap ada agar JS tidak error) -->
  <div class="hidden-element">
    <select id="sheetSelect" onchange="changeSheet()">
      <option value="DASHBOARD">DASHBOARD</option>
      <option value="ACARA">ACARA</option>
      <option value="ABSEN">ABSEN</option>
      <option value="Dashboard">Dashboard</option>
      <option value="Kalender">Kalender</option>
      <option value="REKAP">REKAP</option>
      <option value="PENGELUARAN">PENGELUARAN</option>
    </select>
    <h2 id="sheetTitle"></h2>
    <div id="sheetInfo"></div>
  </div>

  <!-- Status koneksi -->
  <div id="status">Menghubungkan ke server...</div>

  <!-- Panel Tabel Data (TAMPIL) -->
  <section class="panel">
    <div class="table-wrap">
      <table id="dataTable">
        <tbody>
          <tr>
            <td class="empty">Data sedang dimuat...</td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="footer-note">
      Sel berwarna kuning muda dapat diedit jika akun memiliki izin.
      Sel berwarna abu-abu berisi formula atau tidak dapat diedit.
    </div>
  </section>

</main>

<script>
  /* ================================================
     KONFIGURASI
     ================================================ */

  const API_URL = "https://script.google.com/macros/s/AKfycbzLOGNYrQFMm_DWfumPS-12gbLhwS5RWOAeDFqi5uEGpJf59_Gfmd1mNsENNoBtqfzw/exec";

  const SHEET_NAMES = [
    "DASHBOARD",
    "ACARA",
    "ABSEN",
    "Dashboard",
    "Kalender",
    "REKAP",
    "PENGELUARAN"
  ];

  const params = new URLSearchParams(location.search);

  let currentSheet =
    params.get("sheet") || "DASHBOARD";

  if (!SHEET_NAMES.includes(currentSheet)) {
    currentSheet = "DASHBOARD";
  }

  const hashParams = new URLSearchParams(
    location.hash.replace(/^#/, "")
  );

  const TOKEN = hashParams.get("token") || "";

  let currentData = null;
  let pendingChanges = new Map();
  let isLoading = false;
  let isSaving = false;


  /* ================================================
     ELEMEN HTML
     ================================================ */

  const sheetSelect =
    document.getElementById("sheetSelect");

  const sheetTitle =
    document.getElementById("sheetTitle");

  const sheetInfo =
    document.getElementById("sheetInfo");

  const statusBox =
    document.getElementById("status");

  const dataTable =
    document.getElementById("dataTable");

  const saveButton =
    document.getElementById("saveButton");


  /* ================================================
     FUNGSI STATUS
     ================================================ */

  function showStatus(message, type = "") {
    statusBox.textContent = message;
    statusBox.className = type;
  }


  /* ================================================
     KOMUNIKASI API
     ================================================ */

  async function apiRequest(payload) {
    const response = await fetch(API_URL, {
      method: "POST",
      redirect: "follow",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      body: JSON.stringify(payload)
    });

    if (!response.ok) {
      throw new Error(
        "Server memberikan status HTTP " + response.status
      );
    }

    const result = await response.json();

    if (!result.success) {
      throw new Error(
        result.message || "Permintaan API gagal."
      );
    }

    return result.data;
  }


  /* ================================================
     GANTI SHEET
     ================================================ */

  function changeSheet() {
    const nextSheet = sheetSelect.value;

    if (
      pendingChanges.size > 0 &&
      !confirm(
        "Ada perubahan yang belum disimpan. " +
        "Pindah sheet dan membuang perubahan tersebut?"
      )
    ) {
      sheetSelect.value = currentSheet;
      return;
    }

    currentSheet = nextSheet;
    pendingChanges.clear();

    const newUrl = new URL(location.href);
    newUrl.searchParams.set("sheet", currentSheet);

    history.replaceState(null, "", newUrl);

    loadSheet();
  }


  /* ================================================
     MUAT DATA SHEET
     ================================================ */

  async function loadSheet() {
    if (isLoading) return;

    if (pendingChanges.size > 0) {
      if (
        !confirm(
          "Perubahan belum disimpan. Muat ulang dan " +
          "buang perubahan tersebut?"
        )
      ) {
        return;
      }
    }

    isLoading = true;
    pendingChanges.clear();
    updateSaveButton();

    sheetSelect.value = currentSheet;

    showStatus("Sedang mengambil data " + currentSheet + "...");

    dataTable.innerHTML =
      '<tbody><tr><td class="empty">Memuat data...</td></tr></tbody>';

    try {
      const data = await apiRequest({
        action: "getSheetData",
        sheet: currentSheet,
        token: TOKEN
      });

      currentData = data;

      renderTable(data);

      sheetTitle.textContent = data.name;

      sheetInfo.textContent =
        "Baris header: " + data.headerRow +
        " | Total baris data: " + data.rows.length +
        (data.editable ? " | Mode edit aktif" : " | Mode baca");

      showStatus(
        data.editable
          ? "Data berhasil dimuat. Anda memiliki izin edit pada sheet ini."
          : "Data berhasil dimuat dalam mode baca.",
        "success"
      );

      updateSaveButton();

    } catch (err) {
      currentData = null;

      showStatus(
        "Gagal mengambil data: " + err.message,
        "error"
      );

      dataTable.innerHTML =
        '<tbody><tr><td class="empty">Data tidak dapat dimuat.</td></tr></tbody>';

      sheetTitle.textContent = currentSheet;
      sheetInfo.textContent = "Gagal memuat data.";

    } finally {
      isLoading = false;
    }
  }

  /* ================================================
     TAMPILKAN TABEL (WITH FILTER REKAP)
     ================================================ */

  function renderTable(data) {
    dataTable.innerHTML = "";

    // --------------------------------------------------
    // 1. ATURAN FILTER KHUSUS SHEET "REKAP"
    // --------------------------------------------------
    let validColIndexes = data.headers.map(function(_, i) { return i; });
    let rowsToRender = data.rows;

    if (currentSheet === "REKAP") {
      
      // A. SEMBUNYIKAN KOLOM
      // Pilihan 1: Berdasarkan Nama Header (misal: "ID", "Keterangan Rahasia")
      const hiddenHeaderNames = ["Catatan Internal"];

      // Pilihan 2: Berdasarkan Urutan Kolom (0 = Kolom A, 1 = Kolom B, 2 = Kolom C, dst)
      const hiddenColIndexes = [0]; // Contoh: Sembunyikan kolom pertama (Kolom A)

      // Filter indeks kolom yang diizinkan tampil
      validColIndexes = data.headers
        .map(function(header, index) {
          if (hiddenHeaderNames.includes(header) || hiddenColIndexes.includes(index)) {
            return -1; // Tandai untuk disembunyikan
          }
          return index;
        })
        .filter(function(index) { return index !== -1; });


      // B. SEMBUNYIKAN BARIS
      // Pilihan 1: Sembunyikan berdasarkan nomor baris spreadsheet asli (rowNumber)
      const hiddenRowNumbers = [1]; // Contoh: Sembunyikan baris ke-1

      rowsToRender = data.rows.filter(function(rowData) {
        // Sembunyikan jika nomor baris ada di daftar hiddenRowNumbers
        if (hiddenRowNumbers.includes(rowData.rowNumber)) {
          return false;
        }

        // Pilihan 2 (Opsional): Sembunyikan jika baris kosong / nilai kolom pertama null
        // if (!rowData.values[0]) return false;

        return true;
      });
    }

    // 
    // --------------------------------------------------
    // 2. RENDERING HEADER TABEL (KHUSUS SHEET REKAP)
    // --------------------------------------------------
    const thead = document.createElement("thead");

    // Pengecekan ditambah: Hanya jalankan 2 baris jika sheet yang dibuka adalah "REKAP"
    if (currentSheet === "REKAP" && data.headerRow === 2 && data.headerRows && data.headerRows.length === 2) {
      
      const row1 = data.headerRows[0];
      const row2 = data.headerRows[1];

      const tr1 = document.createElement("tr");
      const tr2 = document.createElement("tr");

      let i = 0;
      while (i < validColIndexes.length) {
        const colIdx = validColIndexes[i];
        const h1 = String(row1[colIdx] || "").trim();
        const h2 = String(row2[colIdx] || "").trim();

        let span = 1;
        while (
          i + span < validColIndexes.length &&
          String(row1[validColIndexes[i + span]] || "").trim() === h1 &&
          h1 !== ""
        ) {
          span++;
        }

        if (span > 1) {
          // Merge Horizontal (colspan)
          const th1 = document.createElement("th");
          th1.textContent = h1;
          th1.colSpan = span;
          tr1.appendChild(th1);

          for (let s = 0; s < span; s++) {
            const subIdx = validColIndexes[i + s];
            const th2 = document.createElement("th");
            th2.textContent = String(row2[subIdx] || "").trim() || "(Tanpa judul)";
            tr2.appendChild(th2);
          }
          i += span;
        } else {
          // Kolom Tunggal
          if (h2 === "" || h1 === h2) {
            // Merge Vertikal (rowspan = 2)
            const th = document.createElement("th");
            th.textContent = h1 || h2 || "(Tanpa judul)";
            th.rowSpan = 2;
            tr1.appendChild(th);
          } else {
            const th1 = document.createElement("th");
            th1.textContent = h1;
            tr1.appendChild(th1);

            const th2 = document.createElement("th");
            th2.textContent = h2;
            tr2.appendChild(th2);
          }
          i++;
        }
      }

      thead.appendChild(tr1);
      if (tr2.children.length > 0) {
        thead.appendChild(tr2);
      }

    } else {
      // Header 1 baris standar (Berlaku untuk ACARA, ABSEN, DASHBOARD, dll)
      const headerRow = document.createElement("tr");
      validColIndexes.forEach(function(colIndex) {
        const th = document.createElement("th");
        th.textContent = data.headers[colIndex] || "(Tanpa judul)";
        headerRow.appendChild(th);
      });
      thead.appendChild(headerRow);
    }

    dataTable.appendChild(thead);

    // --------------------------------------------------
    // 3. RENDERING ISI BARIS & DATA
    // --------------------------------------------------
    const tbody = document.createElement("tbody");

    if (!rowsToRender.length) {
      const tr = document.createElement("tr");
      const td = document.createElement("td");

      td.colSpan = validColIndexes.length;
      td.className = "empty";
      td.textContent = "Belum ada data.";

      tr.appendChild(td);
      tbody.appendChild(tr);
      dataTable.appendChild(tbody);
      return;
    }

    rowsToRender.forEach(function(rowData) {
      const tr = document.createElement("tr");

      validColIndexes.forEach(function(colIndex) {
        const td = document.createElement("td");

        const value =
          rowData.values[colIndex] == null
            ? ""
            : rowData.values[colIndex];

        td.textContent = value;

        const isFormula =
          rowData.formulaCols.includes(colIndex + 1);

        if (isFormula) {
          td.classList.add("formula");
          td.title = "Sel formula tidak dapat diedit.";

        } else if (data.editable) {
          td.classList.add("editable");
          td.contentEditable = "true";
          td.spellcheck = false;

          td.dataset.row = rowData.rowNumber;
          td.dataset.col = colIndex + 1; // Menjaga koordinat kolom asli di Google Sheets
          td.dataset.original = value;

          td.addEventListener("input", handleCellEdit);
        }

        tr.appendChild(td);
      });

      tbody.appendChild(tr);
    });

    dataTable.appendChild(tbody);
  }


  /* ================================================
     CATAT PERUBAHAN SEL
     ================================================ */

  function handleCellEdit(event) {
    const cell = event.currentTarget;

    const row = Number(cell.dataset.row);
    const col = Number(cell.dataset.col);
    const original = cell.dataset.original;
    const value = cell.textContent;

    const key = row + ":" + col;

    if (value === original) {
      pendingChanges.delete(key);
      cell.classList.remove("changed");

    } else {
      pendingChanges.set(key, {
        row: row,
        col: col,
        value: value
      });

      cell.classList.add("changed");
    }

    updateSaveButton();

    showStatus(
      pendingChanges.size +
      " sel berubah dan belum disimpan."
    );
  }


  /* ================================================
     TOMBOL SIMPAN
     ================================================ */

  function updateSaveButton() {
    const canSave =
      Boolean(currentData) &&
      currentData.editable === true &&
      Boolean(TOKEN) &&
      pendingChanges.size > 0 &&
      !isSaving;

    saveButton.style.display =
      currentData && currentData.editable
        ? "inline-block"
        : "none";

    saveButton.disabled = !canSave;

    saveButton.textContent =
      isSaving
        ? "Menyimpan..."
        : "Simpan Perubahan (" + pendingChanges.size + ")";
  }


  /* ================================================
     SIMPAN SEMUA PERUBAHAN
     ================================================ */

  async function saveChanges() {
    if (isSaving || pendingChanges.size === 0) {
      return;
    }

    if (!TOKEN) {
      showStatus(
        "Token pengurus tidak ditemukan. Silakan login melalui aplikasi OSIS.",
        "error"
      );
      return;
    }

    if (!confirm(
      "Simpan " + pendingChanges.size +
      " perubahan pada sheet " + currentSheet + "?"
    )) {
      return;
    }

    isSaving = true;
    updateSaveButton();

    const changes = Array.from(
      pendingChanges.values()
    );

    showStatus("Sedang menyimpan perubahan...");

    try {
      const result = await apiRequest({
        action: "saveSheetChanges",
        token: TOKEN,
        sheet: currentSheet,
        changes: changes
      });

      pendingChanges.clear();

      showStatus(
        result.message ||
        "Perubahan berhasil disimpan.",
        "success"
      );

      await loadSheet();

    } catch (err) {
      showStatus(
        "Gagal menyimpan: " + err.message,
        "error"
      );

    } finally {
      isSaving = false;
      updateSaveButton();
    }
  }


  /* ================================================
     MULAI PORTAL
     ================================================ */

  sheetSelect.value = currentSheet;

  if (!TOKEN) {
    showStatus(
      "Mode pengunjung: Anda dapat membaca data publik. " +
      "Login melalui aplikasi OSIS untuk memperoleh hak edit."
    );
  }

  loadSheet();

</script>

</body>
</html>
